# Publishes the static front end (web/) to GitHub Pages. The API stays on Vultr.
# One-time setup: repo Settings -> Pages -> Source = "GitHub Actions".
# Optional: Settings -> Variables -> API_BASE to point at another API URL (no trailing slash).
name: Deploy front end (GitHub Pages)

on:
  push:
    branches: [main, feat/agent]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the front end at the Vultr API
        env:
          API_BASE: ${{ vars.API_BASE || 'https://104-207-147-218.sslip.io' }}
        run: echo "window.IOC_API_BASE='${API_BASE%/}';" > web/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
